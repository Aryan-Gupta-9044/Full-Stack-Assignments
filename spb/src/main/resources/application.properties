spring.application.name=spb
server.port=${PORT:8080}

# File-based H2: data is stored in ./data and survives restarts.
# For a throw-away database use:  jdbc:h2:mem:tasksdb
spring.datasource.url=jdbc:h2:file:./data/tasksdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seed sample tasks on first run (empty DB only)
app.seed=true
